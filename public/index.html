<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Document</title>
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="hero">
            <div class="hero-main">

                <div class="hero-top">

                    <div class="hero-top__title">FEATURED</div>
                    <p class="hero-top__text">2h 18min · Sci-Fi / Thriller · 16+</p>

                </div>

                <h2 class="hero-title">Silent Horizon</h2>

                <div class="rating-container">
                    <img src="assets/star.svg" alt="звезда">
                    <span class="rating-left">8.4</span>
                    <span class="rating-right">/ 10 IMDb</span>
                </div>

                <div class="hero-action">
                    <button class="buy-btn">Buy Tickets</button>
                    <a class="more-info" href="#">More info</a>
                </div>

            </div>
        </section>

        <section class="movie-catalog">

            <div class="movie-nav">
                <h3 class="movie-nav__title">Now Showing</h3>

                <ul class="movie-nav__filters">
                    <li class="movie-nav__filter-item movie-nav__filter-item--active">All Genres</li>
                    <li class="movie-nav__filter-item">Sci-Fi</li>
                    <li class="movie-nav__filter-item">Thriller</li>
                    <li class="movie-nav__filter-item">Action</li>
                </ul>

            </div>

            <div class="movie-grid">

            </div>

        </section>

        <section class="coming-soon">

            <div class="coming-soon__container">
                <h2 class="coming-soon__title">Coming Soon</h2>

                <div class="coming-soon__list">
                    <article class="coming-card">
                        <img class="coming-card__img" src="assets/coming-soon/Chasing Shadows.png"
                            alt="Chasing Shadows">

                        <div class="coming-card__meta">
                            <h3 class="coming-card__title">Chasing Shadows</h3>
                            <p class="coming-card__description">Thriller</p>
                            <div class="coming-card__data">FEB 14</div>
                        </div>

                    </article>

                    <article class="coming-card">
                        <img class="coming-card__img" src="assets/coming-soon/Deep Freeze.png" alt="Deep Freeze">

                        <div class="coming-card__meta">
                            <h3 class="coming-card__title">Deep Freeze</h3>
                            <p class="coming-card__description">Sci-Fi</p>
                            <div class="coming-card__data">FEB 22</div>
                        </div>

                    </article>

                    <article class="coming-card">
                        <img class="coming-card__img" src="assets/coming-soon/Echo Chambers.png" alt="Echo Chambers">

                        <div class="coming-card__meta">
                            <h3 class="coming-card__title">Echo Chambers</h3>
                            <p class="coming-card__description">Drama</p>
                            <div class="coming-card__data">MAR 05</div>
                        </div>

                    </article>

                    <article class="coming-card">
                        <img class="coming-card__img" src="assets/coming-soon/Iron Crown.png" alt="Iron Crown">

                        <div class="coming-card__meta">
                            <h3 class="coming-card__title">Iron Crown</h3>
                            <p class="coming-card__description">History / Epic</p>
                            <div class="coming-card__data">MAR 18</div>
                        </div>

                    </article>
                </div>

            </div>

        </section>
    </main>

    <div class="hr"></div>


    <div id="footer-placeholder"></div>

    <script src="js/include.js"></script>
    <script src="js/home.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>REELLY — страница фильма</title>
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <article class="movie-hero">

            <img class="movie-hero__backdrop" id="movie-backdrop" src="" alt="">

            <div class="movie-hero__content">

                <img class="movie-hero__poster" id="movie-poster" src="" alt="">

                <div class="movie-hero__info" id="movie-info"></div>

            </div>

        </article>

        <section class="session-select">

            <h2 class="session-select__title">Выбор сеанса</h2>
            <p class="session-select__hint">Выберите дату и удобное время, чтобы забронировать места.</p>

            <div class="session-select__dates" id="session-dates"></div>
            <div class="session-select__times" id="session-times"></div>

        </section>
    </main>


    <div id="footer-placeholder"></div>


    <script src="js/include.js"></script>
    <script src="js/movie.js"></script>

</body>

</html>
